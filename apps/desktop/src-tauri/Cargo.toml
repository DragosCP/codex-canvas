[package]
name = "codex-desktop"
version = "0.0.0"
description = "P03 Codex desktop shell"
authors = ["OpenAI"]
edition = "2021"

[[bin]]
name = "codex-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
rfd = "0.15"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.0", features = [] }
